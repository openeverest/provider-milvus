# An Instance the provider refuses at admission: its memory is below the
# minimum.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: invalid-instance
spec:
  providerRef:
    name: milvus
  topology:
    type: standalone
  components:
    standalone:
      type: milvus
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 256Mi
