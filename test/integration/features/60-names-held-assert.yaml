# Expected outcome of adding a name to the running instance: the change is
# held as a RollingRestart maintenance action, and the certificate keeps the
# names it was issued for.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: secure
status:
  (pendingMaintenance[?starts_with(approvalToken, 'tls-names-')] | [0].severity): RollingRestart
---
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: secure
  annotations:
    tls.milvus.openeverest.io/additional-names: milvus.example.com
