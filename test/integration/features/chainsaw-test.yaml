---
# Translation suite for the Milvus provider.
#
# The Milvus operator is scaled to 0 in CI (see the deploy-provider-ci Make
# target), so these steps check what the provider writes onto the Milvus CR
# for features that are pure translation: engine configuration, pod
# customization, deployment groups, probe tuning, version
# upgrade and downgrade rejection, external dependencies, Pulsar, a
# storage location and TLS.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: features
spec:
  description: |
    Per-component settings, version changes and external
    dependencies on cluster Instances.

  catch:
    - script:
        content: kubectl -n $NAMESPACE get instance,milvuses.milvus.io -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-milvus
        tail: 100

  steps:
    - name: provider-deployed
      try:
        - assert:
            file: 00-assert.yaml

    - name: create-features
      try:
        - apply:
            file: 10-create-features.yaml
        - assert:
            file: 10-assert.yaml

    - name: upgrade
      try:
        - patch:
            resource:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              metadata:
                name: features
              spec:
                version: "2.6.25"
        - assert:
            file: 20-assert.yaml

    # Admission refuses a downgrade once the upgrade has been reconciled.
    - name: downgrade-rejected
      try:
        - assert:
            resource:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              metadata:
                name: features
              (status.observedGeneration == metadata.generation): true
        - script:
            content: |
              kubectl patch instance/features -n $NAMESPACE --type=merge -p '{"spec":{"version":"2.6.15"}}'
            check:
              ($error != null): true
              (contains($stderr, 'cannot be downgraded from 2.6.25 to 2.6.15')): true
        - assert:
            file: 30-assert.yaml

    - name: external-dependencies-and-pulsar
      try:
        - apply:
            file: 40-create-deps.yaml
        - assert:
            file: 40-assert.yaml
        # No bundled MinIO, so no generated MinIO credentials.
        - error:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: deps-minio

    - name: storage-location
      try:
        - apply:
            file: 50-create-located.yaml
        - assert:
            file: 50-assert.yaml

    - name: tls-generated-certificate
      try:
        - apply:
            file: 60-create-tls.yaml
        - assert:
            file: 60-assert.yaml

    - name: tls-user-certificate
      try:
        - apply:
            file: 61-user-secret.yaml
        - patch:
            resource:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              metadata:
                name: secure
              spec:
                parameters:
                  tls:
                    certificateSecretName: secure-corp-tls
                    additionalNames: null
        - assert:
            file: 61-assert.yaml

    - name: tls-disabled
      try:
        - patch:
            resource:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              metadata:
                name: secure
              spec:
                parameters:
                  tls:
                    mode: disabled
        - assert:
            file: 62-assert.yaml

    - name: tls-cert-manager-issuer
      try:
        - apply:
            file: 63-create-issued.yaml
        - assert:
            timeout: 2m
            file: 63-assert.yaml

    # The operator is scaled to 0, so clear the Milvus finalizers manually.
    - name: delete-instances
      try:
        - script:
            content: |
              kubectl -n $NAMESPACE delete instance/features instance/deps instance/located instance/secure instance/issued --wait=false
              for name in features deps located secure issued; do
                kubectl -n $NAMESPACE patch milvuses.milvus.io/$name \
                  -p '{"metadata":{"finalizers":null}}' --type merge || true
              done
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: features
            for:
              deletion: {}
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: deps
            for:
              deletion: {}
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: located
            for:
              deletion: {}
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: secure
            for:
              deletion: {}
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: issued
            for:
              deletion: {}
        - wait:
            apiVersion: milvus.io/v1beta1
            kind: Milvus
            name: deps
            for:
              deletion: {}
