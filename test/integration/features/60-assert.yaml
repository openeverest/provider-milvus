# Expected outcome of the tls step: Milvus serves gRPC and REST (on a port of
# its own) over TLS with the generated certificate, mounted into the proxy.
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: secure
spec:
  config:
    common:
      security:
        authorizationEnabled: true
        tlsMode: 1
    proxy:
      http:
        port: 8443
    tls:
      serverPemPath: /milvus/tls/tls.crt
      serverKeyPath: /milvus/tls/tls.key
      caPemPath: /milvus/tls/ca.crt
  components:
    proxy:
      serviceRestfulPort: 8443
      (podAnnotations."tls.milvus.openeverest.io/hash" != null): true
      volumes:
        - name: milvus-tls
          secret:
            secretName: secure-tls
      volumeMounts:
        - name: milvus-tls
          mountPath: /milvus/tls
          readOnly: true
    (queryNode.volumes == null): true
---
apiVersion: v1
kind: Secret
metadata:
  name: secure-tls
type: kubernetes.io/tls
(data."ca.crt" != null): true
(data."tls.crt" != null): true
(data."tls.key" != null): true
---
apiVersion: v1
kind: Secret
metadata:
  name: secure-tls-ca
(data."ca.key" != null): true
