# Expected outcome of the issuer step: a Certificate for the instance's names,
# whose Secret cert-manager labels for the provider's watch and Milvus mounts.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: issued-tls-issued
spec:
  secretName: issued-tls-issued
  issuerRef:
    name: selfsigned
    kind: Issuer
    group: cert-manager.io
  (contains(dnsNames, join('', ['issued-milvus.', $namespace, '.svc']))): true
status:
  (conditions[?type == 'Ready'] | [0].status): "True"
---
apiVersion: v1
kind: Secret
metadata:
  name: issued-tls-issued
  labels:
    tls.milvus.openeverest.io/watched: "true"
  annotations:
    tls.milvus.openeverest.io/instances: issued
---
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: issued
spec:
  config:
    common:
      security:
        tlsMode: 1
  components:
    standalone:
      serviceRestfulPort: 8443
      volumes:
        - name: milvus-tls
          secret:
            secretName: issued-tls-issued
