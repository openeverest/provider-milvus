# Expected outcome of the create-features step: every per-component setting
# lands on the Milvus CR, and monitoring creates the provider's PodMonitor.
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: features
spec:
  mode: cluster
  config:
    queryNode:
      gracefulTime: 1000
    # Set by the provider for every cluster coordinator.
    rootCoord:
      enableActiveStandby: true
  components:
    image: milvusdb/milvus:v2.6.15
    version: 2.6.15
    imageUpdateMode: rollingUpgrade
    # The provider owns the PodMonitor instead of the operator.
    disableMetric: true
    queryNode:
      replicas: 2
      podAnnotations:
        k8s.v1.cni.cncf.io/networks: chainsaw-net
      env:
        - name: CHAINSAW_ENV
          value: "on"
      groups:
        - name: pool-a
          replicas: 1
          nodeSelector:
            pool: a
        - name: pool-b
          replicas: 1
          nodeSelector:
            pool: b
      probes:
        # A tuned probe keeps the operator's check and every other default.
        startupProbe:
          failureThreshold: 60
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          tcpSocket:
            port: 9091
        readinessProbe:
          periodSeconds: 10
          failureThreshold: 2
          httpGet:
            path: /healthz
            port: 9091
            scheme: HTTP
        (livenessProbe == null): true
    dataNode:
      (probes == null): true
      (groups == null): true
  dependencies:
    msgStreamType: woodpecker
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: features-metrics
  labels:
    release: chainsaw
spec:
  selector:
    matchLabels:
      core.openeverest.io/instance: features
      core.openeverest.io/provider: milvus
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
