# Expected outcome of the downgrade step: the Instance keeps the newer
# release, and so does the Milvus CR.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: features
spec:
  version: "2.6.25"
status:
  (phase != 'Failed'): true
---
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: features
spec:
  components:
    image: milvusdb/milvus:v2.6.25
    version: 2.6.25
