# Expected outcome of the downgrade step: the provider's rules reject the
# Instance and the Milvus CR keeps running the newer release.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: features
status:
  (conditions[?type == 'Ready'] | [0].reason): InvalidReference
---
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: features
spec:
  components:
    image: milvusdb/milvus:v2.6.25
    version: 2.6.25
