# Core matches the class to the provider: Milvus serves metrics natively, so
# binding it restarts nothing.
apiVersion: monitoring.openeverest.io/v1alpha1
kind: MonitoringClass
metadata:
  name: metrics-it-milvus
status:
  (conditions[?type == 'Accepted'].status | [0]): "True"
  (providers[?name == 'milvus'] | [0]):
    mode: ExtensionManaged
    disruption: None
