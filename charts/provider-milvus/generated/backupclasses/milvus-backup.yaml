apiVersion: backup.openeverest.io/v1alpha1
kind: BackupClass
metadata:
  name: milvus-backup
spec:
  description: |
    Logical backups of Milvus collections taken with the upstream milvus-backup
    tool. Raw data and index definitions are copied to an S3-compatible
    BackupStorage, and indexes are rebuilt on restore. Point-in-time recovery is
    not supported.
  displayName: Milvus Backup
  executionMode: ProviderManaged
  parametersSchema:
    openAPIV3Schema:
      description: |-
        MilvusBackupParameters describes the parameters accepted by Backup CRs that
        target this class (spec.parameters).
      properties:
        collections:
          description: |-
            Collections limits the backup to a comma-separated list of collections
            in milvus-backup filter syntax: "coll", "db.coll" or "db.*". Empty backs
            up every collection.
          type: string
        includeRBAC:
          description: IncludeRBAC also backs up users, roles and grants.
          type: boolean
      type: object
  providerManaged:
    supportsPITR: false
  restoreParametersSchema:
    openAPIV3Schema:
      description: |-
        MilvusRestoreParameters describes the parameters accepted by Restore CRs
        that target this class (spec.parameters).
      properties:
        collectionSuffix:
          description: |-
            CollectionSuffix restores each collection next to the existing one under
            its name plus this suffix, instead of replacing it.
          pattern: ^[A-Za-z0-9_]*$
          type: string
        collections:
          description: |-
            Collections limits the restore to a comma-separated list of collections
            in milvus-backup filter syntax. Empty restores every collection.
          type: string
        includeRBAC:
          description: |-
            IncludeRBAC also restores users, roles and grants when the backup has
            them.
          type: boolean
        keepExistingCollections:
          description: |-
            KeepExistingCollections fails the restore of a collection that already
            exists instead of dropping and replacing it.
          type: boolean
      type: object
  supportedProviders:
    - milvus
  uiSchema:
    backup:
      components:
        collections:
          fieldParams:
            helperText: Leave empty to back up every collection.
            label: Collections
            placeholder: db.collection, db2.*
          path: parameters.collections
          uiType: text
        includeRBAC:
          fieldParams:
            label: Include users and roles
          path: parameters.includeRBAC
          uiType: toggle
      componentsOrder:
        - collections
        - includeRBAC
      label: Backup configuration
    restore:
      components:
        collectionSuffix:
          fieldParams:
            helperText: Restores next to the existing collections instead of replacing them.
            label: Collection name suffix
          path: parameters.collectionSuffix
          uiType: text
        collections:
          fieldParams:
            helperText: Leave empty to restore every collection in the backup.
            label: Collections
            placeholder: db.collection, db2.*
          path: parameters.collections
          uiType: text
        includeRBAC:
          fieldParams:
            label: Restore users and roles
          path: parameters.includeRBAC
          uiType: toggle
        keepExistingCollections:
          fieldParams:
            helperText: By default a collection that already exists is dropped and replaced. Collections that are not in the backup are never touched.
            label: Keep existing collections
          path: parameters.keepExistingCollections
          uiType: toggle
      componentsOrder:
        - collections
        - collectionSuffix
        - keepExistingCollections
        - includeRBAC
      label: Restore configuration
