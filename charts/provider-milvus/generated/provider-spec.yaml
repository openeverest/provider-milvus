                      type: string
                    cloudProvider:
                      description: |-
                        CloudProvider selects Milvus' provider-specific client, e.g. aws, gcp,
                        azure or aliyun. Used only when External is true.
                      type: string
                    credentialsSecret:
                      description: |-
                        CredentialsSecret names a Secret in the Instance namespace holding the
                        external storage's "accesskey" and "secretkey". Required when External,
                        unless UseIAM is set.
                      type: string
                    endpoint:
                      description: |-
                        Endpoint is the external object storage endpoint (host:port). Used only
                        when External is true.
                      type: string
                    external:
                      description: |-
                        External disables the bundled MinIO and points Milvus at the provided
                        Endpoint instead. Endpoint must be set when External is true.
                      type: boolean
                    persistence:
                      description: Persistence sizes the MinIO data PVC. Ignored when External.
                      properties:
                        size:
                          description: |-
