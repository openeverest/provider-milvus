                      type: object
                    region:
                      description: |-
                        Region is the external bucket's region, e.g. us-east-1. Used only when
                        External is true.
                      type: string
                    replicas:
                      description: |-
                        Replicas sets the bundled MinIO server count. A value > 1 switches MinIO
                        to distributed mode. Ignored when External.
                      format: int32
                      type: integer
                    resources:
                      description: Resources sizes the bundled MinIO pods. Ignored when External.
                      properties:
                        limits:
                          description: Limits is the maximum resources the component may use.
                          properties:
                            cpu:
                              description: CPU quantity, e.g. "500m" or "1".
                              type: string
                            memory:
                              description: Memory quantity, e.g. "512Mi" or "2Gi".
                              type: string
                          type: object
                        requests:
                          description: Requests is the minimum resources guaranteed to the component.
                          properties:
                            cpu:
                              description: CPU quantity, e.g. "500m" or "1".
                              type: string
                            memory:
                              description: Memory quantity, e.g. "512Mi" or "2Gi".
                              type: string
                          type: object
                      type: object
                    rootPath:
                      description: |-
                        RootPath prefixes every object Milvus writes, so several instances can
                        share one bucket. Defaults to "files"; cannot be changed later. Used only
                        when External is true.
                      type: string
                    serviceAccountName:
                      description: |-
                        ServiceAccountName runs the Milvus pods as this ServiceAccount, which
                        carries the cloud identity for UseIAM. Used only when External.
                      type: string
                    type:
                      description: |-
                        Type is the external object storage flavour: MinIO (default), S3 or
                        Azure. Used only when External is true.
                      type: string
                    useIAM:
                      description: |-
                        UseIAM authenticates with the pods' cloud identity (e.g. EKS IRSA, GKE
                        workload identity) instead of static keys. Used only when External.
                      type: boolean
                    useSSL:
                      description: |-
                        UseSSL connects to the external endpoint over TLS. Used only when
                        External is true.
                      type: boolean
                  type: object
                storageClassName:
                  description: |-
                    StorageClassName is the StorageClass of every bundled dependency volume
                    (etcd, MinIO and Pulsar). Empty uses the cluster default. Cannot be
                    changed after creation.
                  type: string
              type: object
            monitoring:
              description: Monitoring configures metrics collection.
              properties:
                prometheus:
                  description: Prometheus configures scraping by the Prometheus Operator.
                  properties:
                    enabled:
                      description: Enabled creates the PodMonitor; disabling it removes the PodMonitor.
                      type: boolean
                    interval:
                      description: |-
                        Interval between scrapes, e.g. 30s. Defaults to the Prometheus global
                        scrape interval.
                      type: string
                    podMonitorLabels:
                      additionalProperties:
                        type: string
                      description: |-
                        PodMonitorLabels are added to the PodMonitor so that the Prometheus
                        podMonitorSelector picks it up (e.g. release: kube-prometheus-stack).
                      type: object
                  type: object
              type: object
          type: object
