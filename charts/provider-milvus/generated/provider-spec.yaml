                        replicas:
                          description: Replicas sets the sub-component replica count.
                          format: int32
                          type: integer
                        resources:
                          description: Resources sizes the sub-component pods.
                          properties:
                            limits:
                              description: Limits is the maximum resources the component may use.
                              properties:
                                cpu:
                                  description: CPU quantity, e.g. "500m" or "1".
                                  type: string
                                memory:
                                  description: Memory quantity, e.g. "512Mi" or "2Gi".
                                  type: string
                              type: object
                            requests:
                              description: Requests is the minimum resources guaranteed to the component.
