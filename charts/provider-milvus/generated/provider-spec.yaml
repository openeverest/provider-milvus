                MinIO) for the cluster deployment.
              properties:
                etcd:
                  description: Etcd configures the metadata store.
                  properties:
                    endpoints:
                      description: |-
                        Endpoints lists external etcd endpoints (host:port). Used only when
                        External is true.
                      items:
                        type: string
                      type: array
                    external:
                      description: |-
                        External disables the bundled etcd and points Milvus at the provided
                        Endpoints instead. Endpoints must be set when External is true.
                      type: boolean
                    persistence:
                      description: Persistence sizes the etcd data PVC. Ignored when External.
                      properties:
                        size:
                          description: |-
                            Size is the PVC size, e.g. "10Gi". Empty falls back to the per-topology
                            default so bundled dependencies never inherit the chart's oversized values.
                          type: string
                      type: object
                    replicas:
                      description: Replicas sets the bundled etcd cluster size. Ignored when External.
                      format: int32
                      type: integer
                    resources:
                      description: Resources sizes the bundled etcd pods. Ignored when External.
                      properties:
                        limits:
                          description: Limits is the maximum resources the component may use.
                          properties:
                            cpu:
                              description: CPU quantity, e.g. "500m" or "1".
                              type: string
                            memory:
                              description: Memory quantity, e.g. "512Mi" or "2Gi".
                              type: string
                          type: object
                        requests:
                          description: Requests is the minimum resources guaranteed to the component.
                          properties:
                            cpu:
                              description: CPU quantity, e.g. "500m" or "1".
                              type: string
                            memory:
                              description: Memory quantity, e.g. "512Mi" or "2Gi".
                              type: string
                          type: object
                      type: object
                    rootPath:
                      description: |-
                        RootPath prefixes every metadata key, so several instances can share one
                        external etcd. Defaults to the Instance name; cannot be changed later.
                        Used only when External is true.
                      type: string
                  type: object
                messageStreamType:
                  description: |-
                    MessageStreamType selects the write-ahead log: "woodpecker" keeps it in
                    the object storage (no extra dependency), "pulsar" deploys or connects to
                    Pulsar. New instances default to woodpecker; it cannot be changed later.
                  type: string
                pulsar:
                  description: |-
                    Pulsar configures the Pulsar message stream. Used only when
                    MessageStreamType is pulsar.
                  properties:
                    bookkeeper:
                      description: |-
                        BookKeeper sizes the Pulsar bookkeeper (bookie) sub-component. Ignored
                        when External.
                      properties:
                        journal:
                          description: Journal sizes the bookie write-ahead journal PVC.
                          properties:
                            size:
                              description: |-
                                Size is the PVC size, e.g. "10Gi". Empty falls back to the per-topology
                                default so bundled dependencies never inherit the chart's oversized values.
                              type: string
                          type: object
                        ledgers:
                          description: Ledgers sizes the bookie ledger storage PVC.
                          properties:
                            size:
                              description: |-
                                Size is the PVC size, e.g. "10Gi". Empty falls back to the per-topology
                                default so bundled dependencies never inherit the chart's oversized values.
                              type: string
                          type: object
                        replicas:
                          description: Replicas sets the bookie replica count.
                          format: int32
                          type: integer
                        resources:
                          description: Resources sizes the bookie pods.
                          properties:
                            limits:
                              description: Limits is the maximum resources the component may use.
                              properties:
                                cpu:
                                  description: CPU quantity, e.g. "500m" or "1".
                                  type: string
                                memory:
                                  description: Memory quantity, e.g. "512Mi" or "2Gi".
                                  type: string
                              type: object
                            requests:
                              description: Requests is the minimum resources guaranteed to the component.
                              properties:
                                cpu:
                                  description: CPU quantity, e.g. "500m" or "1".
                                  type: string
                                memory:
                                  description: Memory quantity, e.g. "512Mi" or "2Gi".
                                  type: string
                              type: object
                          type: object
                      type: object
                    broker:
