# Standalone topology definition for Milvus.
config:
  # parametersSchema references a Go type in definition/topologies/standalone
  # for topology parameters (bundled dependency sizing and external overrides).
  parametersSchema: StandaloneTopologyParameters
  components:
    standalone:
      type: milvus
      replicas: 1
      supportedFields:
        properties:
          replicas: {minimum: 1, maximum: 1}
          # The image comes from image, else version, else the bundle.
          version: {}
          image: {}
          resources: {}
          service: {}
          schedulingPolicy: {}
ui:
  sections:
    basicInfo:
      label: Basic Information
      description: Configure the standalone Milvus deployment.
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: Milvus Version
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: name
              valuePath: name
    resources:
      label: Resources
      description: Configure the core resources for the deployment.
      components:
        cpu:
          uiType: number
          path: spec.components.standalone.resources.limits.cpu
          fieldParams:
            label: CPU
            defaultValue: 1
            step: 0.1
          validation:
            min: 0.1
            required: true
        memory:
          uiType: number
          path: spec.components.standalone.resources.limits.memory
          fieldParams:
            label: Memory
            defaultValue: 4
            step: 0.1
            badge: Gi
            badgeToApi: true
          validation:
            min: 0.5
            required: true
        externalAccess:
          uiType: select
          path: spec.components.standalone.service.serviceType
          fieldParams:
            label: External access
            defaultValue: ClusterIP
            options:
              - label: ClusterIP
                value: ClusterIP
              - label: NodePort
                value: NodePort
              - label: LoadBalancer
                value: LoadBalancer
    objectStorage:
      label: Object storage
      description: Keep Milvus data in the bundled MinIO, or in an S3 storage location from Settings.
      components:
        storageLocation:
          path: spec.topology.parameters.dependencies.storage.backupStorageName
          uiType: text
          fieldParams:
            label: Storage location
            helperText: Name of an S3 storage location in this namespace. Leave empty to use the bundled MinIO sized below.
            modes:
              edit:
                disabled: true
                helperText: The object storage cannot be changed after creation
        replicas:
          path: spec.topology.parameters.dependencies.storage.replicas
          uiType: number
          fieldParams:
            label: Replicas
            defaultValue: 1
          validation:
            min: 1
            int: true
        resources:
          uiType: group
          groupType: line
          components:
            cpu:
              path: spec.topology.parameters.dependencies.storage.resources.requests.cpu
              uiType: number
              fieldParams:
                label: CPU
                defaultValue: 0.1
                step: 0.1
              validation:
                min: 0.1
            memory:
              path: spec.topology.parameters.dependencies.storage.resources.requests.memory
              uiType: number
              fieldParams:
                label: RAM
                defaultValue: 0.25
                step: 0.1
                badge: Gi
                badgeToApi: true
              validation:
                min: 0.1
            storage:
              path: spec.topology.parameters.dependencies.storage.persistence.size
              uiType: number
              fieldParams:
                label: Storage
                defaultValue: 10
                badge: Gi
                badgeToApi: true
              validation:
                min: 1
                int: true
      componentsOrder:
        - storageLocation
        - replicas
        - resources
    metadataStore:
      label: Metadata store
      description: Configure the bundled metadata store.
      components:
        replicas:
          path: spec.topology.parameters.dependencies.etcd.replicas
          uiType: number
          fieldParams:
            label: Replicas
            defaultValue: 1
          validation:
            min: 1
            int: true
        resources:
          uiType: group
          groupType: line
          components:
            cpu:
              path: spec.topology.parameters.dependencies.etcd.resources.requests.cpu
              uiType: number
              fieldParams:
                label: CPU
                defaultValue: 0.1
                step: 0.1
              validation:
                min: 0.1
            memory:
              path: spec.topology.parameters.dependencies.etcd.resources.requests.memory
              uiType: number
              fieldParams:
                label: RAM
                defaultValue: 0.25
                step: 0.1
                badge: Gi
                badgeToApi: true
              validation:
                min: 0.1
            storage:
              path: spec.topology.parameters.dependencies.etcd.persistence.size
              uiType: number
              fieldParams:
                label: Storage
                defaultValue: 10
                badge: Gi
                badgeToApi: true
              validation:
                min: 1
                int: true
      componentsOrder:
        - replicas
        - resources
    monitoring:
      label: "Monitoring"
      description: "Collect Milvus metrics with Prometheus."
      components:
        prometheus:
          uiType: toggle
          path: spec.topology.parameters.monitoring.prometheus.enabled
          fieldParams:
            label: "Prometheus"
            helperText: "Creates a PodMonitor that scrapes Milvus metrics. Requires the Prometheus Operator."
      componentsOrder:
        - prometheus
    tls:
      label: "TLS"
      description: "Encrypt connections between clients and Milvus."
      components:
        mode:
          uiType: select
          path: spec.parameters.tls.mode
          fieldParams:
            label: "TLS mode"
            defaultValue: "disabled"
            options:
              - label: "Disabled: clients connect in plain text"
                value: "disabled"
              - label: "Required: clients must use TLS"
                value: "requireTLS"
        certificates:
          uiType: group
          groupType: bordered
          label: "Certificate"
          description: "Leave empty to have a certificate issued by a CA created for the instance. Clients find the CA in the connection secret as ca.crt."
          components:
            certificateSecretName:
              uiType: text
              path: spec.parameters.tls.certificateSecretName
              fieldParams:
                label: "Certificate secret"
                helperText: "Secret with tls.crt, tls.key and ca.crt; it must cover <instance>-milvus.<namespace>.svc"
              validation:
                celExpressions:
                  - celExpr: "!has(spec.parameters.tls.certificateSecretName) || spec.parameters.tls.certificateSecretName == '' || !has(spec.parameters.tls.issuer.name) || spec.parameters.tls.issuer.name == ''"
                    message: "Use either a certificate secret or an issuer, not both"
            issuer:
              uiType: group
              groupType: line
              components:
                issuerName:
                  uiType: text
                  path: spec.parameters.tls.issuer.name
                  fieldParams:
                    label: "cert-manager issuer"
                    helperText: "Issuer that signs the certificate"
                issuerKind:
                  uiType: select
                  path: spec.parameters.tls.issuer.kind
                  fieldParams:
                    label: "Issuer kind"
                    defaultValue: "Issuer"
                    options:
                      - label: "Issuer"
                        value: "Issuer"
                      - label: "ClusterIssuer"
                        value: "ClusterIssuer"
              componentsOrder:
                - issuerName
                - issuerKind
          componentsOrder:
            - certificateSecretName
            - issuer
      componentsOrder:
        - mode
        - certificates
    advanced:
      label: "Advanced configuration"
      description: "Configure advanced Milvus engine settings."
      components:
        configuration:
          uiType: text
          path: spec.components.standalone.parameters.configuration
          fieldParams:
            label: "Engine configuration"
            placeholder: |2
              log:
                level: info
              proxy:
                maxNameLength: 255
            multiline: true
            minRows: 3
            maxRows: 8
        podSchedulingPolicy:
          uiType: group
          groupType: bordered
          label: Pod scheduling policy
          components:
            policy:
              uiType: widget
              widgetType: podSchedulingPolicy
        storageClass:
          uiType: select
          path: spec.topology.parameters.dependencies.storageClassName
          dataSource:
            provider: storageClasses
          fieldParams:
            label: Storage class
            helperText: StorageClass of the bundled etcd and object storage volumes.
            modes:
              edit:
                disabled: true
      componentsOrder:
        - configuration
        - storageClass
        - podSchedulingPolicy
  sectionsOrder:
    - basicInfo
    - resources
    - objectStorage
    - metadataStore
    - monitoring
    - tls
    - advanced
