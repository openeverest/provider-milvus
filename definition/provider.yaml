# Provider identity and component definitions.
# Keep this aligned with common.ProviderName and the chart metadata.
name: milvus

# Instance-wide parameters (Instance.spec.parameters), a Go type in
# definition/types.go.
parametersSchema: Parameters

components:
  standalone:
    type: milvus
    parametersSchema: MilvusParameters
  proxy:
    type: milvus
    parametersSchema: MilvusParameters
  mixCoord:
    type: milvus
    parametersSchema: MilvusParameters
  rootCoord:
    type: milvus
    parametersSchema: MilvusParameters
  indexCoord:
    type: milvus
    parametersSchema: MilvusParameters
  dataCoord:
    type: milvus
    parametersSchema: MilvusParameters
  queryCoord:
    type: milvus
    parametersSchema: MilvusParameters
  indexNode:
    type: milvus
    parametersSchema: MilvusParameters
  dataNode:
    type: milvus
    parametersSchema: MilvusParameters
  queryNode:
    type: milvus
    parametersSchema: MilvusParameters
  streamingNode:
    type: milvus
    parametersSchema: MilvusParameters

# Component types: the kind of the software each type runs, published as
# Provider.spec.componentTypes.<type>.kind and matched by monitoring classes.
# Milvus has no OpenTelemetry db.system.name of its own, so it takes the
# lowercase product name, as the convention says. Version catalogs stay in
# versions.yaml.
componentTypes:
  milvus:
    kind: milvus
